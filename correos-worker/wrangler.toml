name = "sinapsis-correos"
main = "worker.js"
compatibility_date = "2026-07-01"

# Se despierta solo cada día a las 9:00 (UTC 14:00 = 9:00 Colombia)
[triggers]
crons = ["0 14 * * *"]

# Estado de envíos (a quién se le mandó qué y cuándo): evita duplicados.
[[kv_namespaces]]
binding = "CORREOS_ESTADO"
id = "5979fe3a33004c96b5b8406a4dda2f1e"

[vars]
FIRESTORE_PROJECT = "red-egresados-65a1a"
FIRESTORE_APP_ID = "1:874010522484:web:28881821d110defd3b7221"
SITIO = "https://sinapsisred.web.app"
# El From lo impone Gmail: tiene que ser la cuenta autenticada (o un alias
# verificado en ella). Cambiar esta dirección sin re-autorizar no sirve.
REMITENTE = "Sinapsis <sinapsis.ecosistema@gmail.com>"
RESPUESTA_A = "sinapsis.ecosistema@gmail.com"

# Secretos (NO van aquí), desde esta carpeta:
#   npx wrangler secret put GMAIL_CLIENT_ID
#   npx wrangler secret put GMAIL_CLIENT_SECRET
#   npx wrangler secret put GMAIL_REFRESH_TOKEN

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinapsis | Iniciar Sesión</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #fafaf9; }
        .glass-nav { background: rgba(250,250,249,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(231,229,228,0.6); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .section-card { background:#fff; padding:1.5rem; border-radius:2rem; border:1px solid #f5f5f4; box-shadow:0 8px 30px rgb(20 83 45/0.03); margin-bottom:1.5rem; transition:all 0.2s ease; }
        @media(min-width:768px){ .section-card{padding:2rem;} }
        .section-card:hover { box-shadow: 0 12px 40px rgb(22 163 74/0.08); }
        .input-label { font-size:0.75rem; font-weight:700; color:#78716c; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.5rem; display:block; }
        .input-field { width:100%; padding:0.85rem 1rem; background:rgba(250,250,249,0.9); border:1px solid #e7e5e4; border-radius:0.75rem; outline:none; transition:all 0.2s ease; font-size:0.9rem; font-weight:500; color:#292524; }
        .input-field:focus { border-color:#16a34a; box-shadow:0 0 0 4px rgb(34 197 94/0.15); background:#fff; }
    </style>
    <link rel="stylesheet" href="tailwind.css?v=4">
</head>
<body class="text-stone-800 font-sans min-h-screen flex flex-col">

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-[0_20px_50px_rgb(0,0,0,0.08)] border border-gray-100 w-full max-w-md relative overflow-hidden animate-fade-in">
            <div class="absolute top-0 right-0 w-40 h-40 bg-brand-50 rounded-bl-full -z-10 opacity-70"></div>
            <div class="text-center mb-8">
                <svg viewBox="0 0 32 32" role="img" aria-label="Sinapsis" class="w-16 h-16 mx-auto mb-4 shrink-0"><defs><linearGradient id="neuro-login" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs><g fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" opacity=".85"><path d="M13.6 12.6 L9.4 5.6 M11 15 L3.6 12.2 M12.4 19.6 L6.6 25.4 M17.6 19.8 L21.4 26.4 M19.4 14.6 L27.4 11.4 M18.2 12.2 L22.6 6.2"/></g><g fill="none" stroke="#86efac" stroke-width="1.1" stroke-linecap="round" opacity=".7"><path d="M9.4 5.6 L3.6 12.2 M21.4 26.4 L27.4 11.4 M3.6 12.2 L6.6 25.4"/></g><circle cx="15.6" cy="16.2" r="5" fill="url(#neuro-login)"/><circle cx="15.6" cy="16.2" r="2" fill="#dcfce7"/><g fill="#16a34a"><circle cx="9" cy="4.6" r="2"/><circle cx="2.8" cy="11.8" r="2"/><circle cx="6" cy="26.2" r="2"/><circle cx="21.9" cy="27.4" r="2"/><circle cx="28.4" cy="11" r="2"/><circle cx="23.2" cy="5.4" r="2"/></g></svg>
                <h1 class="text-2xl font-bold text-gray-900">Hola de nuevo</h1>
                <p class="text-gray-500 text-sm mt-2">Red exclusiva de egresados</p>
            </div>

            <form onsubmit="authLogic.login(event)" class="space-y-5">
                <div>
                    <label class="input-label">Correo o usuario</label>
                    <input id="login-email" type="text" required autocomplete="username" placeholder="wanda.cg o tu.nombre@gmail.com" class="input-field">
                </div>
                <div>
                    <label class="input-label">Contraseña</label>
                    <input id="login-password" type="password" required placeholder="••••••••" class="input-field">
                </div>
                <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-lg shadow-brand-500/30 transition transform hover:scale-[1.02]">
                    Ingresar
                </button>
            </form>
            <button onclick="authLogic.loginWithGoogle()" class="w-full py-3.5 mt-3 bg-white text-gray-700 font-bold rounded-xl border border-gray-200 hover:bg-gray-50 transition flex items-center justify-center gap-2">
                <i class="ph ph-google-logo"></i> Continuar con Google
            </button>
            <p id="auth-feedback" class="text-xs text-red-600 mt-3 text-center font-semibold"></p>

            <div class="mt-8 text-center border-t border-gray-100 pt-6 space-y-2">
                <a href="register.html" class="text-sm text-brand-600 font-bold hover:underline block">Crear cuenta</a>
                <button onclick="authLogic.browseAsGuest()" class="block w-full text-sm text-gray-600 font-semibold hover:text-brand-600 transition">Revisar la red como invitado</button>
            </div>
        </div>
    </main>

    <script src="theme.js?v=9"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <script src="shared.js?v=22"></script>
    <script>
        const authLogic = {
            login: async (e) => {
                e.preventDefault();
                const identity = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const feedback = document.getElementById('auth-feedback');
                try {
                    state.guestMode = false;
                    sessionStorage.removeItem('guestMode');
                    const authEmail = await resolveAuthEmail(identity);
                    await auth.signInWithEmailAndPassword(authEmail, password);
                } catch (error) {
                    feedback.classList.add('text-red-600');
                    feedback.textContent = getFriendlyAuthError(error, 'No pudimos iniciar sesión.');
                }
            },
            loginWithGoogle: async () => {
                const feedback = document.getElementById('auth-feedback');
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    state.guestMode = false;
                    sessionStorage.removeItem('guestMode');
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    feedback.classList.add('text-red-600');
                    feedback.textContent = getFriendlyAuthError(error, 'No pudimos iniciar sesión con Google.');
                }
            },
            browseAsGuest: () => {
                state.guestMode = true;
                sessionStorage.setItem('guestMode', 'true');
                // Visita a proposito: se levanta la marca de miembro para que la
                // sesion anonima si pueda abrirse (ver MARCA_MIEMBRO en shared.js).
                olvidarNavegadorConMiembro();
                goto('directory');
            }
        };
        window.authLogic = authLogic;

        auth.onAuthStateChanged((user) => {
            // OJO: con la sesion de invitado, "hay user" ya no significa "hay
            // miembro". Sin el chequeo de isAnonymous, el visitante que abre
            // /login saldria expulsado al directorio en cuanto arranca la
            // sesion anonima, y NUNCA podria iniciar sesion ni registrarse.
            if (user && !user.isAnonymous) goto('directory');
        });
    </script>
</body>
</html>
